services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderbook}
      POSTGRES_DB: ${POSTGRES_DB:-orderbook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderbook} -d ${POSTGRES_DB:-orderbook}"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      # Market data is append-heavy; give the WAL room before tuning for real.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--appendonly", "no", "--save", ""]

volumes:
  postgres-data:
  redis-data:
