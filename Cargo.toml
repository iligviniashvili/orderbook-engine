[workspace]
resolver = "2"
members = [
    "crates/bench",
    "crates/core",
    "crates/gateway",
    "crates/ingest",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/iligviniashvili/orderbook-engine"

[workspace.dependencies]
obe-core = { path = "crates/core" }
obe-gateway = { path = "crates/gateway" }
obe-ingest = { path = "crates/ingest" }
obe-storage = { path = "crates/storage" }

anyhow = "1"
axum = "0.8"
config = { version = "0.15", default-features = false, features = ["toml"] }
deadpool-redis = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# `tokio-comp` is what makes `Client::get_async_pubsub` available: a
# subscriber needs a connection of its own, because a subscribed connection
# stops accepting ordinary commands and so cannot come from the shared pool.
redis = { version = "0.32", default-features = false, features = [
    "script",
    "tokio-comp",
] }
# `native-tls` rather than a rustls backend, for the same reason the storage
# TLS feature is optional: rustls needs a crypto provider that wants a C
# toolchain, while native-tls hands TLS to the platform — schannel on Windows,
# Secure Transport on macOS, the system OpenSSL on Linux.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "query",
] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `macros` is here for the `FromRow` derive and `migrate!`, not for the
# compile-time-checked `query!` family: queries stay runtime-checked, so
# neither the build nor CI needs a live database or a checked-in `.sqlx`
# cache. TLS is behind the optional `obe-storage/tls` feature because it drags
# in a C toolchain that a plain `cargo test` should not require.
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    "json",
    "postgres",
    "runtime-tokio",
    "rust_decimal",
    "time",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# Pinned to the minor axum 0.8 depends on, so the workspace builds one copy of
# the WebSocket stack instead of two that cannot exchange types.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "native-tls",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
