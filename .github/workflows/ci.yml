name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (TLS feature)
        run: cargo clippy -p obe-storage --features tls --locked -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  integration:
    name: storage integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orderbook
          POSTGRES_PASSWORD: orderbook
          POSTGRES_DB: orderbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbook -d orderbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OBE_TEST_DATABASE_URL: postgres://orderbook:orderbook@localhost:5432/orderbook
      OBE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply migrations
        run: cargo run -p obe-storage --bin obe-migrate --locked
        env:
          OBE__DATABASE__URL: postgres://orderbook:orderbook@localhost:5432/orderbook
      - name: Integration tests
        # --nocapture so a skipped test (missing service URL) is visible in the
        # log rather than passing silently.
        run: cargo test -p obe-storage --test integration --locked -- --nocapture
      - name: API tests
        run: cargo test -p obe-gateway --test api --locked -- --nocapture
      - name: End-to-end tests
        # One test binary, one thread: each case stands up its own ingestor and
        # gateway against the shared services, and serialising them keeps the
        # publish-tick timing in the assertions rather than in the scheduler.
        run: cargo test -p obe-gateway --test end_to_end --locked -- --nocapture --test-threads=1

  bench:
    name: benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A small workload, and nothing is asserted on the numbers: a shared CI
      # runner is not a measurement instrument. This is here so the benchmark
      # cannot rot unnoticed between the times it is run in earnest.
      - name: Run the benchmark
        run: cargo run --release -p obe-bench --locked -- --events 5000 --subscribers 20

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet
